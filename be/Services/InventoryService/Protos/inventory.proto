syntax = "proto3";

option csharp_namespace = "PRN232ASM.Inventory.Grpc";

package inventory;

service JournalInventory {
  rpc GetCapacity (CapacityRequest) returns (CapacityReply);
}

message CapacityRequest {
  string journal_id = 1;
  string journal_name = 2;
  int32 year = 3;
  int32 papers_in_year = 4;
  int32 total_papers = 5;
}

message CapacityReply {
  string journal_id = 1;
  int32 year = 2;
  int32 capacity = 3;
  int32 used = 4;
  int32 remaining = 5;
  string status = 6;
  string note = 7;
}
