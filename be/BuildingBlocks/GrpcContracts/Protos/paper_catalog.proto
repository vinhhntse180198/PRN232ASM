syntax = "proto3";

option csharp_namespace = "PRN232ASM.BuildingBlocks.GrpcContracts.Papers";

package papers;

// Internal catalog API used by TrendService to aggregate publication trends.
service PaperCatalog {
  rpc SearchPapers (SearchPapersRequest) returns (SearchPapersResponse);
}

message SearchPapersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
}

message SearchPapersResponse {
  repeated PaperSummary items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

message PaperSummary {
  string id = 1;
  int32 publication_year = 2;
  repeated string keywords = 3;
}
