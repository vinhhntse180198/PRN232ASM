name: prn232asm

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prn232asm-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: prn232asm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../be
      dockerfile: Gateway/ApiGateway/Dockerfile
    container_name: prn232asm-api-gateway
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      JWT__Secret: ${JWT_SECRET:-PRN232ASM_JWT_Secret_Key_2026_Change_In_Production_32chars}
      JWT__Issuer: PRN232ASM
      JWT__Audience: PRN232ASM-Users
      ReverseProxy__Clusters__auth-cluster__Destinations__auth__Address: http://auth-service:8080
      ReverseProxy__Clusters__paper-cluster__Destinations__paper__Address: http://paper-service:8080
      ReverseProxy__Clusters__trend-cluster__Destinations__trend__Address: http://trend-service:8080
      ReverseProxy__Clusters__notification-cluster__Destinations__notification__Address: http://notification-service:8080
      ReverseProxy__Clusters__sync-cluster__Destinations__sync__Address: http://sync-service:8080
    depends_on:
      - auth-service
      - paper-service
      - trend-service
      - notification-service
      - sync-service

  auth-service:
    build:
      context: ../be
      dockerfile: Services/AuthService/AuthService.Api/Dockerfile
    container_name: prn232asm-auth-service
    ports:
      - "5131:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      JWT__Secret: ${JWT_SECRET:-PRN232ASM_JWT_Secret_Key_2026_Change_In_Production_32chars}
      JWT__Issuer: PRN232ASM
      JWT__Audience: PRN232ASM-Users
    depends_on:
      sqlserver:
        condition: service_healthy

  paper-service:
    build:
      context: ../be
      dockerfile: Services/PaperService/PaperService.Api/Dockerfile
    container_name: prn232asm-paper-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PaperDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  trend-service:
    build:
      context: ../be
      dockerfile: Services/TrendService/TrendService.Api/Dockerfile
    container_name: prn232asm-trend-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TrendDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__HangfireConnection: "Server=sqlserver,1433;Database=TrendDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__QueuePrefix: trend
      PaperService__GrpcUrl: http://paper-service:8080
      PaperService__BaseUrl: http://paper-service:8080
      JWT__Secret: ${JWT_SECRET:-PRN232ASM_JWT_Secret_Key_2026_Change_In_Production_32chars}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      paper-service:
        condition: service_started

  notification-service:
    build:
      context: ../be
      dockerfile: Services/NotificationService/NotificationService.Api/Dockerfile
    container_name: prn232asm-notification-service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__QueuePrefix: notification
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sync-service:
    build:
      context: ../be
      dockerfile: Services/SyncService/SyncService.Api/Dockerfile
    container_name: prn232asm-sync-service
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SyncDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      ConnectionStrings__HangfireConnection: "Server=sqlserver,1433;Database=SyncDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Prn232_Sql_Strong!2026};TrustServerCertificate=True;Encrypt=False;"
      OpenAlex__Enabled: "true"
      OpenAlex__BaseUrl: "https://api.openalex.org"
      OpenAlex__DefaultYear: "2024"
      OpenAlex__DefaultYears: "2024"
      OpenAlex__MaxImportCount: "200"
      OpenAlex__ApiKey: ""
      PaperService__BaseUrl: http://paper-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      paper-service:
        condition: service_started

  fe:
    profiles: ["frontend"]
    build:
      context: ../fe
      dockerfile: Dockerfile
    container_name: prn232asm-fe
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - api-gateway

volumes:
  sqlserver-data:
